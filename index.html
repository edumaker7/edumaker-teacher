<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀메이커 - 강사 관리 시스템</title>
    <style>
        @import url('https://cdn.rawgit.com/moonspam/NanumSquare/master/nanumsquare.css');

        body {
            font-family: 'NanumSquare', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f9f1 0%, #e8f5e9 100%);
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        .bg-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(57, 181, 74, 0.08);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
        }
        .circle-1 { top: -10%; right: -5%; }
        .circle-2 { bottom: -10%; left: -5%; }

        .main-container {
            display: flex;
            max-width: 1100px;
            width: 90%;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            z-index: 10;
        }

        .hero-section {
            flex: 1.2;
            color: #2c3e50;
            text-align: left;
        }

        .hero-section h1 {
            font-size: 44px; 
            font-weight: 800;
            line-height: 1.4;
            margin: 0 0 28px 0;
            word-break: keep-all;
            color: #1a1a1a;
            letter-spacing: -1.5px;
        }


        .hero-section h1 .highlight-text {
            display: block; 
            font-size: 52px;
            color: #39B54A;
            margin-top: 10px;
        }

        .hero-section p {
            font-size: 20px;
            color: #5d6d7e;
            line-height: 1.7;
            font-weight: 400;
            margin: 0;
        }

        .login-card {
            width: 420px;
            padding: 45px;
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px);
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-sizing: border-box;
        }

        .login-card h2 {
            margin: 0 0 35px 0;
            font-size: 24px;
            color: #333;
            text-align: center;
            font-weight: 800;
        }

        .input-group { text-align: left; margin-bottom: 24px; }
        
        label { 
            display: block; 
            font-size: 14px; 
            font-weight: 700; 
            color: #444; 
            margin-bottom: 10px; 
            margin-left: 4px; 
        }

        input { 
            width: 100%; 
            padding: 16px; 
            border: 1px solid #e0e0e0; 
            border-radius: 14px; 
            font-size: 15px; 
            box-sizing: border-box; 
            transition: all 0.3s ease; 
            background-color: #fff; 
            font-family: 'NanumSquare', sans-serif;
        }
        
        input:focus { 
            outline: none; 
            border-color: #39B54A; 
            box-shadow: 0 0 0 4px rgba(57, 181, 74, 0.1); 
        }

        .btn-group { margin-top: 30px; }
        button { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-family: 'NanumSquare', sans-serif;
        }
        
        .btn-login { 
            background-color: #39B54A; 
            color: white; 
            margin-bottom: 12px; 
            box-shadow: 0 8px 16px rgba(57, 181, 74, 0.2); 
        }
        .btn-login:hover { background-color: #2e933c; transform: translateY(-1px); }
        
        .btn-signup { 
            background-color: transparent; 
            color: #495057; 
            border: 1px solid #dee2e6; 
            font-size: 14px; 
            margin-bottom: 10px; 
        }
        .btn-signup:hover { background-color: rgba(255,255,255,0.5); }

        .find-links { margin-top: 15px; font-size: 13px; color: #adb5bd; text-align: center; }
        .find-links a { cursor: pointer; text-decoration: none; color: #888; margin: 0 8px; transition: 0.2s; }
        .find-links a:hover { color: #39B54A; text-decoration: underline; }

        .btn-admin-mode { 
            background-color: transparent; 
            color: #ced4da; 
            font-size: 11px; 
            font-weight: 400; 
            text-decoration: underline; 
            border: none; 
            padding: 5px; 
            margin-top: 15px; 
            cursor: pointer;
            width: auto; 
            display: block; 
            margin: 15px auto 0;
        }

        .footer { 
            position: absolute; 
            bottom: 30px; 
            width: 100%; 
            text-align: center; 
            font-size: 12px; 
            color: #999; 
            line-height: 1.8; 
            z-index: 20;
        }
        .footer a { color: #888; text-decoration: none; margin: 0 8px; cursor: pointer; }

        @media (max-width: 950px) {
            body { height: auto; padding: 60px 0; overflow: visible; }
            .main-container { flex-direction: column; text-align: center; gap: 40px; }
            .hero-section { text-align: center; }
            .hero-section h1 { font-size: 34px; }
            .hero-section h1 .highlight-text { font-size: 40px; }
            .login-card { width: 100%; max-width: 450px; }
            .bg-circle { display: none; }
            .footer { position: relative; bottom: auto; margin-top: 50px; }
        }
    </style>
</head>
<body>

    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="main-container">
        <div class="hero-section">
            <h1>교육의 미래를<br>함께 설계하는 파트너,
                <span class="highlight-text">에듀메이커 강사 플랫폼</span>
            </h1>
            <p>디지털콘텐츠 융합교육 전문가를 위한<br>에듀메이커의 통합 관리 시스템입니다.</p>
        </div>

        <div class="login-card">
            <h2>강사 로그인</h2>
            
            <div class="input-group">
                <label for="email">이메일 주소</label>
                <input type="email" id="email" placeholder="이메일을 입력하세요">
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요">
            </div>

            <div class="btn-group">
                <button class="btn-login" id="loginBtn">강사 로그인</button>
                <button class="btn-signup" id="signupBtn">신규 강사 회원가입</button>
                
                <div class="find-links">
                    <a id="findIdBtn">아이디 찾기</a>
                    <span style="color:#eee">|</span>
                    <a id="findPwBtn">비밀번호 찾기</a>
                </div>

                <button class="btn-admin-mode" id="adminBtn">관리자 모드 접속</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-links">
            <a onclick="openPrivacyPopup()">개인정보처리방침</a>
            <span class="footer-divider">|</span>
            <a href="mailto:edumaker08@gmail.com">이메일 문의</a>
            <span class="footer-divider">|</span>
            <a href="http://pf.kakao.com/_xhSsRb" target="_blank">카카오톡 채널</a>
        </div>
        <div class="copyright">
            © 2026 EDUMAKER. All Rights Reserved.
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKA0GjAlOF826TZl49y67H4oz8nMW_Jbw",
            authDomain: "edumaker-teacher-d97ba.firebaseapp.com",
            projectId: "edumaker-teacher-d97ba",
            storageBucket: "edumaker-teacher-d97ba.firebasestorage.app",
            messagingSenderId: "532708143359",
            appId: "1:532708143359:web:89b9933da4c868127ddcca",
            measurementId: "G-JJ1TF77VBJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function openPopup(url, name, width, height) {
            const left = (window.screen.width / 2) - (width / 2);
            const top = (window.screen.height / 2) - (height / 2);
            window.open(url, name, `width=${width},height=${height},left=${left},top=${top},scrollbars=no,resizable=no`);
        }

        document.getElementById('findIdBtn').addEventListener('click', () => { openPopup('find_id.html', 'FindID', 450, 500); });
        document.getElementById('findPwBtn').addEventListener('click', () => { openPopup('find_pw.html', 'FindPW', 450, 580); });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const pw = document.getElementById('password').value;
            if(!email || !pw) { alert("정보를 입력해주세요."); return; }
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, pw);
                window.location.href = (userCredential.user.email === "help@edumaker.kr") ? "admin.html" : "teacher_main.html";
            } catch (error) { alert("로그인 실패.\n이메일과 비밀번호를 확인해주세요."); }
        });

        document.getElementById('adminBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const pw = document.getElementById('password').value;
            if (email === "help@edumaker.kr") {
                try {
                    await signInWithEmailAndPassword(auth, email, pw);
                    alert("관리자 권한으로 접속합니다.");
                    window.location.href = "admin.html";
                } catch (error) { alert("관리자 인증 실패: 비밀번호가 올바르지 않습니다."); }
            } else { alert("관리자 계정 이메일이 아닙니다."); }
        });

        document.getElementById('signupBtn').addEventListener('click', () => { window.location.href = 'signup.html'; });
        window.openPrivacyPopup = function() { openPopup('privacy.html', 'PrivacyPolicy', 600, 800); }
    </script>
</body>
</html>
