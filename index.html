<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀메이커 - 강사 관리 시스템</title>
    <style>
        @import url('https://cdn.rawgit.com/moonspam/NanumSquare/master/nanumsquare.css');

        body {
            font-family: 'NanumSquare', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f9f1 0%, #e8f5e9 100%);
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        .bg-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(57, 181, 74, 0.08);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
        }
        .circle-1 { top: -10%; right: -5%; }
        .circle-2 { bottom: -10%; left: -5%; }

        .main-container {
            display: flex;
            max-width: 1100px;
            width: 90%;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            z-index: 10;
        }

        .hero-section {
            flex: 1.2;
            color: #2c3e50;
            text-align: left;
            margin-top: -60px;
        }

        .hero-section h1 {
            font-size: 44px; 
            font-weight: 800;
            line-height: 1.4;
            margin: 0 0 28px 0;
            word-break: keep-all;
            color: #1a1a1a;
            letter-spacing: -1.5px;
        }


        .hero-section h1 .highlight-text {
            display: block; 
            font-size: 52px;
            color: #39B54A;
            margin-top: 10px;
        }

        .hero-section p {
            font-size: 20px;
            color: #5d6d7e;
            line-height: 1.7;
            font-weight: 400;
            margin: 0;
        }

        .login-card {
            width: 420px;
            padding: 45px;
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px);
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-sizing: border-box;
        }

        .login-card h2 {
            margin: 0 0 35px 0;
            font-size: 24px;
            color: #333;
            text-align: center;
            font-weight: 800;
        }

        .input-group { text-align: left; margin-bottom: 24px; }
        
        label { 
            display: block; 
            font-size: 14px; 
            font-weight: 700; 
            color: #444; 
            margin-bottom: 10px; 
            margin-left: 4px; 
        }

        input { 
            width: 100%; 
            padding: 16px; 
            border: 1px solid #e0e0e0; 
            border-radius: 14px; 
            font-size: 15px; 
            box-sizing: border-box; 
            transition: all 0.3s ease; 
            background-color: #fff; 
            font-family: 'NanumSquare', sans-serif;
        }
        
        input:focus { 
            outline: none; 
            border-color: #39B54A; 
            box-shadow: 0 0 0 4px rgba(57, 181, 74, 0.1); 
        }

        .btn-group { margin-top: 30px; }
        button { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-family: 'NanumSquare', sans-serif;
        }
        
        .btn-login { 
            background-color: #39B54A; 
            color: white; 
            margin-bottom: 12px; 
            box-shadow: 0 8px 16px rgba(57, 181, 74, 0.2); 
        }
        .btn-login:hover { background-color: #2e933c; transform: translateY(-1px); }
        
        .btn-signup { 
            background-color: transparent; 
            color: #495057; 
            border: 1px solid #dee2e6; 
            font-size: 14px; 
            margin-bottom: 10px; 
        }
        .btn-signup:hover { background-color: rgba(255,255,255,0.5); }

        .find-links { margin-top: 15px; font-size: 13px; color: #adb5bd; text-align: center; }
        .find-links a { cursor: pointer; text-decoration: none; color: #888; margin: 0 8px; transition: 0.2s; }
        .find-links a:hover { color: #39B54A; text-decoration: underline; }

        .btn-admin-mode { 
            background-color: transparent; 
            color: #ced4da; 
            font-size: 11px; 
            font-weight: 400; 
            text-decoration: underline; 
            border: none; 
            padding: 5px; 
            margin-top: 15px; 
            cursor: pointer;
            width: auto; 
            display: block; 
            margin: 15px auto 0;
        }

        .footer { 
            position: absolute; 
            bottom: 30px; 
            width: 100%; 
            text-align: center; 
            font-size: 12px; 
            color: #999; 
            line-height: 1.8; 
            z-index: 20;
        }
        .footer a { color: #888; text-decoration: none; margin: 0 8px; cursor: pointer; }

        @media (max-width: 950px) {
            body { height: auto; padding: 60px 0; overflow: visible; }
            .main-container { flex-direction: column; text-align: center; gap: 40px; }
            .hero-section { text-align: center; }
            .hero-section h1 { font-size: 34px; }
            .hero-section h1 .highlight-text { font-size: 40px; }
            .login-card { width: 100%; max-width: 450px; }
            .bg-circle { display: none; }
            .footer { position: relative; bottom: auto; margin-top: 50px; }
        }
    </style>
</head>
