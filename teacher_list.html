<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀메이커 - 강사 명단 관리</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f9; padding: 40px; margin: 0; color: #333; }
        
        .container { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f3f5; padding-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 24px; font-weight: 800; color: #0056b3; cursor: pointer; text-decoration: none; }
        
        .header-btn-group { display: flex; gap: 10px; }
        
        .btn-header { 
            padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; 
            text-decoration: none; color: white; transition: background 0.2s; border: none; cursor: pointer;
        }
        
        .btn-status { background-color: #17a2b8; }
        .btn-status:hover { background-color: #138496; }
        
        .btn-back { background-color: #0056b3; }
        .btn-back:hover { background-color: #004494; }

        /* 필터 및 정렬 영역 스타일 */
        .filter-container {
            display: flex;
            gap: 15px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #eef0f2;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-weight: 700; font-size: 14px; color: #555; }
        .filter-select, .filter-input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
            background-color: white;
            min-width: 150px;
        }
        .filter-input { min-width: 200px; }
        .filter-select:focus, .filter-input:focus { border-color: #0056b3; box-shadow: 0 0 0 2px rgba(0,86,179,0.05); }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table { width: 100%; min-width: 800px; border-collapse: collapse; }
        
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; white-space: nowrap; }
        th { background-color: #fcfcfc; color: #555; font-weight: 700; }
        tr:hover { background-color: #f9fbff; }

        .col-num { width: 60px; text-align: center; color: #999; }
        .col-date { width: 130px; color: #666; }
        
        .btn-delete {
            background-color: #fff1f0; color: #ff4d4f; border: 1px solid #ffccc7; padding: 7px 14px;
            border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .btn-delete:hover { background-color: #ff4d4f; color: white; }

        @media (max-width: 600px) {
            body { padding: 20px; }
            .container { padding: 20px; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-btn-group { width: 100%; justify-content: space-between; margin-top: 10px; }
            .btn-header { flex: 1; text-align: center; }
            .filter-container { flex-direction: column; align-items: stretch; }
            .filter-group { flex-direction: column; align-items: flex-start; }
            .filter-select, .filter-input { width: 100%; box-sizing: border-box; }
            .filter-group[style*="margin-left: auto"] { margin-left: 0 !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="admin.html" class="logo">EDUMAKER ADMIN</a>
            <h2 style="margin:0; font-size:18px;">📋 강사 통합 명단</h2>
        </div>
        
        <div class="header-btn-group">
            <a href="status.html" class="btn-header btn-status">📋 강사배정현황</a>
            <a href="admin.html" class="btn-header btn-back">강의 배정 페이지로</a>
        </div>
    </div>

    <div class="filter-container">
        <div class="filter-group">
            <label>📅 가입날짜:</label>
            <select id="dateSort" class="filter-select">
                <option value="desc">최신순 (내림차순)</option>
                <option value="asc">과거순 (오름차순)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>👤 이름순:</label>
            <select id="nameSort" class="filter-select">
                <option value="none">정렬 안함</option>
                <option value="asc">가나다순 (A-Z)</option>
                <option value="desc">역순 (Z-A)</option>
            </select>
        </div>
        
        <div style="margin-left: auto; display: flex; gap: 15px; flex-wrap: wrap;">
            <div class="filter-group">
                <label>🔍 상세지역 검색:</label>
                <input type="text" id="regionKeyword" class="filter-input" placeholder="예: 서울, 경기">
            </div>
            <div class="filter-group">
                <label>📍 지역 필터:</label>
                <select id="regionSelect" class="filter-select">
                    <option value="all">전체 지역보기</option>
                </select>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="col-num">번호</th>
                    <th class="col-date">가입날짜</th>
                    <th>이름</th>
                    <th>전화번호</th>
                    <th>이메일주소(아이디)</th>
                    <th>활동지역</th>
                    <th style="text-align: center;">관리</th>
                </tr>
            </thead>
            <tbody id="teacherTableBody">
                <tr><td colspan="7" style="text-align:center; padding:50px; color:#999;">데이터를 안정적으로 불러오는 중입니다...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDKA0GjAlOF826TZl49y67H4oz8nMW_Jbw",
        authDomain: "edumaker-teacher-d97ba.firebaseapp.com",
        projectId: "edumaker-teacher-d97ba",
        storageBucket: "edumaker-teacher-d97ba.firebasestorage.app",
        messagingSenderId: "532708143359",
        appId: "1:532708143359:web:89b9933da4c868127ddcca",
        measurementId: "G-JJ1TF77VBJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function formatDate(timestamp) {
        if (!timestamp) return "-";
        try {
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        } catch (e) { return "-"; }
    }

    const teacherTableBody = document.getElementById('teacherTableBody');
    const regionSelect = document.getElementById('regionSelect');
    const regionKeyword = document.getElementById('regionKeyword');
    const dateSort = document.getElementById('dateSort');
    const nameSort = document.getElementById('nameSort');

    let allTeachers = []; 

    function updateRegionDropdown(teachers) {
        const regions = new Set();
        teachers.forEach(t => {
            if (t.region) regions.add(t.region.trim());
        });
        const currentVal = regionSelect.value;
        regionSelect.innerHTML = '<option value="all">전체 지역보기</option>';
        Array.from(regions).sort().forEach(region => {
            const option = document.createElement('option');
            option.value = region;
            option.textContent = region;
            regionSelect.appendChild(option);
        });
        regionSelect.value = currentVal;
    }

    function processAndRender() {
        let filtered = [...allTeachers];

        const keyword = regionKeyword.value.trim().toLowerCase();
        if (keyword) {
            filtered = filtered.filter(teacher => 
                (teacher.region || '').toLowerCase().includes(keyword)
            );
        }

        const selectedRegion = regionSelect.value;
        if (selectedRegion !== "all") {
            filtered = filtered.filter(teacher => 
                (teacher.region || '').trim() === selectedRegion
            );
        }

        if (nameSort.value !== "none") {
            filtered.sort((a, b) => {
                const valA = String(a.name || '');
                const valB = String(b.name || '');
                return nameSort.value === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });
        } else {
            filtered.sort((a, b) => {
                const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
                const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
                return dateSort.value === 'asc' ? timeA - timeB : timeB - timeA;
            });
        }

        teacherTableBody.innerHTML = '';
        if (filtered.length === 0) {
            teacherTableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:50px;">조건에 맞는 강사가 없습니다.</td></tr>`;
            return;
        }

        filtered.forEach((teacher, index) => {
            const virtualNo = filtered.length - index;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-num">${virtualNo}</td>
                <td class="col-date">${formatDate(teacher.createdAt)}</td>
                <td style="font-weight:700;">${String(teacher.name || '-')}</td>
                <td>${String(teacher.phone || '-')}</td>
                <td>${String(teacher.email || '-')}</td>
                <td>${String(teacher.region || '-')}</td>
                <td style="text-align: center;">
                    <button class="btn-delete" onclick="deleteTeacher('${teacher.id}', '${teacher.name}')">삭제</button>
                </td>
            `;
            teacherTableBody.appendChild(tr);
        });
    }

    const q = query(collection(db, "users"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        allTeachers = [];
        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data.email !== "help@edumaker.kr") {
                allTeachers.push({ id: docSnap.id, ...data });
            }
        });
        updateRegionDropdown(allTeachers);
        processAndRender();
    });

    regionKeyword.addEventListener('input', processAndRender);
    regionSelect.addEventListener('change', processAndRender);
    dateSort.addEventListener('change', () => {
        if(dateSort.value !== "none") nameSort.value = "none";
        processAndRender();
    });
    nameSort.addEventListener('change', () => {
        if(nameSort.value !== "none") dateSort.value = "none";
        processAndRender();
    });

    window.deleteTeacher = async function(id, name) {
        if (confirm(`'${name}' 강사님의 정보를 삭제하시겠습니까?\n삭제 후에는 복구할 수 없습니다.`)) {
            try {
                await deleteDoc(doc(db, "users", id));
                alert("삭제되었습니다.");
            } catch (error) { alert("삭제 실패: " + error.message); }
        }
    }
</script>
</body>
</html>
