<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀메이커 - 전체 배정 현황</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f0f4f8; padding: 40px; margin: 0; padding-bottom: 100px; }
        .list-container { max-width: 1650px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f3f5; padding-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 24px; font-weight: 800; color: #0056b3; cursor: pointer; text-decoration: none; }
        h2 { color: #1a1a1a; margin: 0; font-size: 20px; }
        .header-btn-group { display: flex; gap: 10px; }
        .btn-header { padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; color: white; transition: background 0.2s; border: none; cursor: pointer; }
        .btn-tab { background-color: #f1f3f5; color: #495057; border: 1px solid #e9ecef; }
        .btn-tab.active { background-color: #343a40; color: white; border-color: #343a40; }
        .btn-back { background-color: #6c757d; color: white; }
        
        .filter-bar { margin-bottom: 20px; display: flex; align-items: center; gap: 12px 20px; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; flex-wrap: wrap; }
        .filter-item { display: flex; align-items: center; gap: 8px; font-size: 13.5px; white-space: nowrap; }
        .filter-bar select, .filter-bar input { padding: 8px 10px; border-radius: 6px; border: 1px solid #ced4da; font-size: 13px; background-color: white; }
        
        .date-search-group { margin-left: auto; display: flex; align-items: center; gap: 5px; }
        .btn-search { background-color: #0056b3; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin-right: 8px; }
        .btn-reset { background-color: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin-right: 5px; }
        .btn-excel { background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        /* 추가된 통합 메일 버튼 스타일 */
        .btn-mail-multi { background-color: #d93025; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin-right: 5px; }
        .btn-mail-group { background-color: #1a73e8; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }

        .table-responsive { width: 100%; overflow-x: auto; border-bottom: 1px solid #eee; position: relative; }
        table { width: 100%; min-width: 1100px; border-collapse: collapse; table-layout: fixed; border-top: 2px solid #343a40; }
        th, td { border-bottom: 1px solid #eee; padding: 12px 8px; text-align: left; font-size: 13px; vertical-align: middle; }
        th { background-color: #fafafa; color: #495057; font-weight: 700; font-size: 12px; text-align: center; }
        
        /* 체크박스 열 너비 조절 */
        .col-check { width: 15px; text-align: center; }
        .col-no { width: 20px; text-align: center; }
        .col-date { width: 90px; text-align: center; }
        .col-user { width: 115px; text-align: center; }
        .col-info { width: 175px; } 
        .col-pay { width: 80px; text-align: right; }
        .col-total { width: 80px; text-align: right; }
        .col-extra { width: 70px; text-align: right; }
        .col-note { width: 155px; }
        .col-chk { width: 70px; text-align: center; }
        .col-manage { width: 80px; text-align: center; }

        .email-link { font-size: 11px; color: #0056b3; text-decoration: underline; transition: opacity 0.2s; cursor: pointer; font-weight: 500; }
        .email-link:hover { opacity: 0.7; color: #d93025; }

        .row-class-finished, .row-class-finished td { background-color: #f3e5f5 !important; }
        .row-finished, .row-finished td { background-color: #fffde7 !important; }

        .note-container { 
            font-size: 12px; color: #444; max-height: 95px; overflow-y: auto; 
            text-align: left !important; line-height: 1.6; padding: 5px 8px;
            white-space: pre-wrap; word-break: break-all;
            background-color: transparent !important;
            border: 1px solid rgba(0,0,0,0.06); border-radius: 4px; display: block;
        }

        .admin-note-section {
            margin-top: 8px; padding-top: 6px; border-top: 1px dashed #d1d1d1;
            color: #e67e22; font-weight: 600; font-size: 11px; white-space: pre-wrap;
        }

        .btn-group { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
        .btn-group button { border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; padding: 5px 0; color: white; width: 48%; }
        .btn-finish { background-color: #28a745 !important; } 
        .btn-restore { background-color: #555e67 !important; } 
        .btn-confirm-wait { background:#ffeeba; color:#856404 !important; }
        .btn-confirm-ok { background:#d4edda; color:#155724 !important; }
        .btn-edit { background-color: #0056b3; }
        .btn-delete { background-color: #ff4d4f; }

        .chk-group { display: flex; flex-direction: column; gap: 4px; font-size: 11px; align-items: flex-start; padding-left: 5px; }
        .chk-group label { display: flex; align-items: center; cursor: pointer; gap: 4px; color: #444; }
        .summary-bar { margin-top: 20px; background-color: #f8f9fa; border: 2px solid #343a40; border-radius: 12px; padding: 20px 30px; display: flex; justify-content: flex-end; align-items: center; gap: 30px; }
        .purple-text { color: #6741d9; font-weight: 600; }
        .profit-text { color: #003399; font-weight: 800; }
    </style>
</head>
<body>

<div class="list-container">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;"><a href="admin.html" class="logo">EDUMAKER ADMIN</a><h2>📊 전체 배정 현황 (종합)</h2></div>
        <div class="header-btn-group">
            <a href="status.html" class="btn-header btn-tab active">전체보기</a>
            <a href="status_general.html" class="btn-header btn-tab">일반강의</a>
            <a href="status_find.html" class="btn-header btn-tab">찾학컨</a>
            <a href="status_dsac.html" class="btn-header btn-tab">디싹</a>
            <a href="admin.html" class="btn-header btn-back">강의 배정 페이지</a>
        </div>
    </div>
    
    <div class="filter-bar">
        <div class="filter-item"><strong>🔍 강사:</strong><select id="teacherFilter" onchange="filterAssignments()"></select></div>
        <div class="filter-item"><strong>🏫 강의처:</strong><select id="clientFilter" onchange="filterAssignments()"></select></div>
        <div class="filter-item"><strong>🏛️ 의뢰처:</strong><select id="requestClientFilter" onchange="filterAssignments()"></select></div>
        <div class="filter-item"><strong>🎖️ 역할:</strong><select id="roleFilter" onchange="filterAssignments()"></select></div>
        <div class="filter-item"><strong>✅ 확인:</strong><select id="confirmFilter" onchange="filterAssignments()"><option value="all">전체</option><option value="confirmed">확인완료</option><option value="pending">확인대기</option></select></div>
        <div class="filter-item"><strong>💰 강사료:</strong><select id="teacherPaidFilter" onchange="filterAssignments()"><option value="all">전체</option><option value="paid">지급완료</option><option value="unpaid">미지급</option><option value="direct">의뢰처 지급</option></select></div>
        <div class="filter-item"><strong>🏷️ 이용료:</strong><select id="servicePaidFilter" onchange="filterAssignments()"><option value="all">전체</option><option value="paid">확인완료</option><option value="unpaid">미확인</option><option value="none">이용료 없음</option></select></div>
        <div class="filter-item"><strong>🚩 완료:</strong><select id="finishedFilter" onchange="filterAssignments()"><option value="all">전체</option><option value="finished">최종완료</option><option value="ongoing">진행중</option></select></div>
        <div class="date-search-group">
            <strong>📅 기간:</strong>
            <input type="date" id="startDate"> ~ <input type="date" id="endDate">
            <button class="btn-search" onclick="filterAssignments()">조회</button>
            <button class="btn-reset" onclick="resetFilters()">초기화</button>
            
            <button class="btn-mail-multi" onclick="sendMultiMail()">✉️ 통합 메일 발송</button>
            <button class="btn-mail-group" onclick="sendGroupMail()">👥 그룹 주소 넣기</button>
            <button class="btn-excel" onclick="downloadExcel()">📊 엑셀 다운로드</button>
        </div>
    </div>

    <div class="table-responsive">
        <table id="actual-data-table">
            <thead><tr>
                <th class="col-check"><input type="checkbox" id="selectAll" onclick="toggleAllChecks(this.checked)"></th>
                <th class="col-no">No</th>
                <th class="col-date">교육일자/시간</th>
                <th class="col-user">이름/전화번호/이메일</th>
                <th class="col-info">강의처(의뢰처) / 강좌명 / 역할</th>
                <th class="col-pay">시간/시급/합계</th>
                <th class="col-total">원시간/원시급/원강사료</th>
                <th class="col-extra">추가비용/이용료</th>
                <th class="col-note">비고</th>
                <th class="col-chk">정산 처리</th>
                <th class="col-manage">관리</th>
            </tr></thead>
            <tbody id="admin-list-body"><tr><td colspan="11" style="text-align:center; padding:40px;">데이터를 불러오는 중...</td></tr></tbody>
        </table>
    </div>
    <div id="summary-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDKA0GjAlOF826TZl49y67H4oz8nMW_Jbw", authDomain: "edumaker-teacher-d97ba.firebaseapp.com", projectId: "edumaker-teacher-d97ba", storageBucket: "edumaker-teacher-d97ba.firebasestorage.app", messagingSenderId: "532708143359", appId: "1:532708143359:web:89b9933da4c868127ddcca", measurementId: "G-JJ1TF77VBJ" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let allAssignments = []; let currentlyShownData = []; let isInitialLoad = true;

    onSnapshot(query(collection(db, "assignments"), orderBy("createdAt", "desc"), limit(500)), (sn) => {
        let rawData = sn.docs.map(d => ({ id: d.id, data: d.data() }));
        rawData.sort((a, b) => ((b.data.date || "").split(', ')[0] || "0000-00-00").localeCompare((a.data.date || "").split(', ')[0] || "0000-00-00"));
        allAssignments = rawData.map((item, index) => ({ ...item, virtualNo: rawData.length - index }));
        if (isInitialLoad) { updateFilterOptions(); isInitialLoad = false; }
        filterAssignments(); 
    });

    function updateFilterOptions() {
        const tSet = new Set(); const cSet = new Set(); const rSet = new Set(); const roleSet = new Set();
        allAssignments.forEach(i => { if(i.data.teacherName) tSet.add(i.data.teacherName); if(i.data.client) cSet.add(i.data.client); if(i.data.requestClient) rSet.add(i.data.requestClient); if(i.data.role) roleSet.add(i.data.role); });
        document.getElementById('teacherFilter').innerHTML = `<option value="all">전체 강사</option>` + Array.from(tSet).sort().map(t => `<option value="${t}">${t}</option>`).join('');
        document.getElementById('clientFilter').innerHTML = `<option value="all">전체 강의처</option>` + Array.from(cSet).sort().map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('requestClientFilter').innerHTML = `<option value="all">전체 의뢰처</option>` + Array.from(rSet).sort().map(r => `<option value="${r}">${r}</option>`).join('');
        document.getElementById('roleFilter').innerHTML = `<option value="all">전체 역할</option>` + Array.from(roleSet).sort().map(role => `<option value="${role}">${role}</option>`).join('');
    }

    function getDayOfWeek(dateStr) { const week = ['일', '월', '화', '수', '목', '금', '토']; const day = new Date(dateStr).getDay(); return isNaN(day) ? "" : `(${week[day]})`; }
    window.updatePayStatus = async function(id, f, v) { await updateDoc(doc(db, "assignments", id), { [f]: v }); }
    window.toggleFinishStatus = async function(id, cur) { if(!confirm("상태를 변경하시겠습니까?")) return; await updateDoc(doc(db, "assignments", id), { isFinished: !cur }); }
    window.deleteAssignment = async function(id, s, t) { if (!confirm(t + " 강사님의 " + s + " 내역을 삭제하시겠습니까?")) return; await deleteDoc(doc(db, "assignments", id)); }

    // 전체 체크박스 토글
    window.toggleAllChecks = (checked) => {
        document.querySelectorAll('.row-checkbox').forEach(chk => chk.checked = checked);
    };

    // 1. 통합 메일 발송 (체크된 모든 항목의 강의 정보를 한 명에게 묶어서 보냄)
    window.sendMultiMail = () => {
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
        if (checkedBoxes.length === 0) return alert('발송할 항목을 체크해 주세요.');

        const selectedData = Array.from(checkedBoxes).map(chk => {
            return currentlyShownData.find(item => item.id === chk.value);
        });

        const teacherName = selectedData[0].data.teacherName;
        const teacherEmail = selectedData[0].data.teacherEmail || '';

        let lectureInfoStr = '';
        selectedData.forEach((item, idx) => {
            const d = item.data;
            lectureInfoStr += `\n[강의 ${idx + 1}]\n- 강의처: ${d.client}\n- 강좌명: ${d.subject}\n- 교육일자: ${d.date || '-'}\n- 의뢰기관: ${d.requestClient || '-'}\n- 서비스 이용료: ${Number(d.serviceFee || 0).toLocaleString()}원\n`;
        });

        const subject = `[에듀메이커] ${teacherName} 강사님, 안내 메일입니다.`;
        const body = `안녕하세요, ${teacherName} 강사님\n에듀메이커 입니다.\n\n\n\n내용 확인 부탁드립니다.\n\n[강의 정보 리스트]${lectureInfoStr}\n\n감사합니다. 에듀메이커 드림`;

        const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${teacherEmail}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        window.open(gmailUrl, '_blank');
    };

    // 2. 그룹 주소 넣기 (체크된 모든 강사의 이메일을 '받는사람'에 넣고 본문은 비움)
    window.sendGroupMail = () => {
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
        if (checkedBoxes.length === 0) return alert('항목을 체크해 주세요.');

        const emails = Array.from(new Set(Array.from(checkedBoxes).map(chk => {
            const item = currentlyShownData.find(i => i.id === chk.value);
            return item.data.teacherEmail;
        }))).filter(e => e);

        const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${emails.join(',')}`;
        window.open(gmailUrl, '_blank');
    };

    function renderList(dataList) {
        currentlyShownData = dataList; const listBody = document.getElementById('admin-list-body'); const summaryCon = document.getElementById('summary-container');
        let html = ""; let sumS = 0; let sumG = 0; let sumO = 0; let totalProfit = 0;

        dataList.forEach((item) => {
            const d = item.data; 
            const hrs = Number(d.classHours || 0); const aHrs = d.adminHours !== undefined ? Number(d.adminHours) : 0; 
            const rate = Number(d.hourlyRate || 0); const orig = Number(d.originalFee || 0); 
            const add = Number(d.additionalCost || 0); const fee = Number(d.serviceFee || 0);
            const totalPay = (hrs * rate) + add; const totalOrig = (aHrs * orig); 
            sumS += fee; sumG += totalPay; sumO += totalOrig;
            if (orig > 0) totalProfit += (totalOrig - (hrs * rate));

            let schHtml = ""; (d.date || "").split(', ').forEach((dt, i) => { schHtml += `<div style="margin-bottom:3px;"><b>${dt}${getDayOfWeek(dt)}</b><br><span style="color:#0056b3; font-size:11px;">${(d.time||"").split(', ')[i]||''}</span></div>`; });
            const req = (d.requestClient || "").trim();
            const lecCheckHtml = (req === "에듀메이커") ? `<label><input type="checkbox" ${d.isPaidTeacher ? 'checked' : ''} onchange="updatePayStatus('${item.id}', 'isPaidTeacher', this.checked)"> 강사료완료</label>` : `<span style="color:#aaa; font-size:10px;">(의뢰처 직접 지급)</span>`;
            const serCheckHtml = (fee > 0) ? `<label><input type="checkbox" ${d.isPaidService ? 'checked' : ''} onchange="updatePayStatus('${item.id}', 'isPaidService', this.checked)"> 이용료확인</label>` : `<span style="color:#aaa; font-size:10px;">(이용료 없음)</span>`;

            let finalNoteHtml = `<div class="note-container">${(d.note && d.note.toString().trim()) ? d.note.toString().trim() : '-'}`;
            if (d.adminNote && d.adminNote.toString().trim()) { finalNoteHtml += `<div class="admin-note-section">${d.adminNote.toString().trim()}</div>`; }
            finalNoteHtml += `</div>`;

            // 개별 메일 발송 로직 (기존 유지)
            const emailValue = d.teacherEmail ? d.teacherEmail : '';
            const customSubject = `[에듀메이커] ${d.teacherName} 강사님, 안내 메일입니다.`;
            const customBody = `안녕하세요, ${d.teacherName} 강사님\n에듀메이커 입니다.\n\n\n\n내용 확인 부탁드립니다.\n\n[강의 정보]\n강의처: ${d.client}\n강좌명: ${d.subject}\n교육일자: ${d.date || '-'}\n의뢰기관 : ${d.requestClient || '-'}\n서비스 이용료 : ${Number(d.serviceFee || 0).toLocaleString()}원\n\n감사합니다. 에듀메이커 드림`;
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${emailValue}&su=${encodeURIComponent(customSubject)}&body=${encodeURIComponent(customBody)}`;
            const emailHtml = emailValue ? `<a href="${gmailUrl}" target="_blank" class="email-link">${emailValue}</a>` : '-';

            html += `
                <tr class="${d.isFinished ? 'row-finished' : (d.isClassFinished ? 'row-class-finished' : '')}">
                    <td class="col-check"><input type="checkbox" class="row-checkbox" value="${item.id}"></td>
                    <td class="col-no">${item.virtualNo}</td>
                    <td class="col-date">${schHtml}</td>
                    <td class="col-user"><b>${d.teacherName}</b><br><span style="font-size:11.5px; color:#555;">${d.phone || '-'}</span><br>${emailHtml}</td>
                    <td class="col-info"><b>${d.client}</b> <span class="purple-text">(${d.requestClient || '-'})</span><br><span style="font-size:12.5px; color:#555;">${d.subject}</span><br><span style="font-size:11.5px; color:#0056b3; font-weight:600;">역할: ${d.role || '강사'}</span></td>
                    <td class="col-pay">${hrs}h<br>${rate.toLocaleString()}<br><b>${totalPay.toLocaleString()}</b></td>
                    <td class="col-total">${aHrs}h<br>${orig.toLocaleString()}<br><span class="purple-text">${totalOrig.toLocaleString()}</span></td>
                    <td class="col-extra"><span class="add-cost-text">${add.toLocaleString()}</span><br><span style="color:#0056b3;">${fee.toLocaleString()}</span></td>
                    <td class="col-note">${finalNoteHtml}</td>
                    <td class="col-chk"><div class="chk-group">${lecCheckHtml}${serCheckHtml}<label><input type="checkbox" ${d.isClassFinished ? 'checked' : ''} onchange="updatePayStatus('${item.id}', 'isClassFinished', this.checked)"> 수업종료</label></div></td>
                    <td class="col-manage"><div class="btn-group"><button class="${d.status === '확인완료' ? 'btn-confirm-ok' : 'btn-confirm-wait'}">${d.status === '확인완료' ? '확인됨' : '대기중'}</button><button class="${d.isFinished ? 'btn-restore' : 'btn-finish'}" onclick="toggleFinishStatus('${item.id}', ${d.isFinished})">${d.isFinished ? '복구' : '완료'}</button><button class="btn-edit" onclick="window.open('edit.html?id=${item.id}')">수정</button><button class="btn-delete" onclick="deleteAssignment('${item.id}', '${d.subject}', '${d.teacherName}')">삭제</button></div></td>
                </tr>`;
        });
        listBody.innerHTML = html || '<tr><td colspan="11" style="text-align:center; padding:40px;">내역이 없습니다.</td></tr>';
        summaryCon.innerHTML = `<div class="summary-bar"><span>총 <b>${currentlyShownData.length}</b>건</span> | <span>이용료: <b>${sumS.toLocaleString()}</b>원</span> | <span class="purple-text">원강사료 합계: <b>${sumO.toLocaleString()}</b>원</span> | <span style="font-weight:bold; color:#d93025;">합계: <b>${sumG.toLocaleString()}</b>원</span> | <span class="profit-text">수익: <b>${totalProfit.toLocaleString()}</b>원</span></div>`;
    }

    window.filterAssignments = () => {
        const t = document.getElementById('teacherFilter').value; const c = document.getElementById('clientFilter').value;
        const r = document.getElementById('requestClientFilter').value; const role = document.getElementById('roleFilter').value;
        const s = document.getElementById('confirmFilter').value; const teacherPaid = document.getElementById('teacherPaidFilter').value;
        const servicePaid = document.getElementById('servicePaidFilter').value; const finished = document.getElementById('finishedFilter').value;
        const start = document.getElementById('startDate').value; const end = document.getElementById('endDate').value;
        const filtered = allAssignments.filter(item => { const d = item.data; if (t !== "all" && d.teacherName !== t) return false; if (c !== "all" && d.client !== c) return false; if (r !== "all" && d.requestClient !== r) return false; if (role !== "all" && d.role !== role) return false; if (s === "confirmed" && d.status !== '확인완료') return false; if (s === "pending" && d.status === '확인완료') return false; if (teacherPaid === "paid" && !d.isPaidTeacher) return false; if (teacherPaid === "unpaid" && (d.isPaidTeacher || (d.requestClient || "").trim() !== "에듀메이커")) return false; if (teacherPaid === "direct" && (d.requestClient || "").trim() === "에듀메이커") return false; if (servicePaid === "paid" && !d.isPaidService) return false; if (servicePaid === "unpaid" && (d.isPaidService || Number(d.serviceFee || 0) <= 0)) return false; if (servicePaid === "none" && Number(d.serviceFee || 0) > 0) return false; if (finished === "finished" && !d.isFinished) return false; if (finished === "ongoing" && d.isFinished) return false; if (start && end) { const dates = (d.date || "").split(', '); if (!dates.some(dt => dt >= start && dt <= end)) return false; } return true; });
        renderList(filtered);
        document.getElementById('selectAll').checked = false; // 필터링 시 체크 초기화
    }
    window.downloadExcel = function() {
        if (currentlyShownData.length === 0) return;
        const excelData = currentlyShownData.map(item => { const d = item.data; return { "번호": item.virtualNo, "교육일자": d.date, "강사명": d.teacherName, "의뢰처": d.requestClient || "-", "강의처": d.client, "강좌명": d.subject, "역할": d.role, "시간": d.classHours, "추가비용": d.additionalCost, "시급": d.hourlyRate, "합계": (Number(d.classHours)*Number(d.hourlyRate)) + Number(d.additionalCost), "원강사료": Number(d.adminHours)*Number(d.originalFee), "서비스 이용료": d.serviceFee || 0, "비고": d.note || "", "관리자기록": d.adminNote || "", "완료여부": d.isFinished ? "완료" : "진행중" }; });
        const worksheet = XLSX.utils.json_to_sheet(excelData); const workbook = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(workbook, worksheet, "전체배정현황"); XLSX.writeFile(workbook, `에듀메이커_전체현황_${new Date().toISOString().slice(0,10)}.xlsx`);
    };
    window.resetFilters = () => { document.querySelectorAll('.filter-bar select').forEach(s => s.value = 'all'); document.querySelectorAll('.filter-bar input').forEach(i => i.value = ''); filterAssignments(); }
</script>
</body>
